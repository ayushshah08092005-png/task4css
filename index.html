<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="left">
            <img src="https://img.magnific.com/free-photo/wooden-bridge-koh-nangyuan-island-surat-thani-thailand_335224-1082.jpg?semt=ais_hybrid&w=740&q=80"
                alt="">
        </div>

        <div class="right">
            <h1>Wellcome Back!</h1>
            <p>This website is designed to help travelers discover top distinations, plan their trips,and book
                unforgettable experience </p>

                <div class="input-groups">
                    <label for="email">Email Address</label>
                    <input type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required>
                </div>

                <div class="input-groups">
                    <label for="password">Password</label>
                    <input type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
                    <a href="#">Forgot Password</a>
                </div>

                
             
                <div class="button">
                    <button>Login</button>
                </div>
        </div>
    </div>
</body>

</html>
